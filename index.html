<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mi Amor</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <!-- Librería oficial para Modelos 3D (.glb) -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
</head>
<body>

    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>
    <div id="background-icons"></div>

    <div id="loader-screen" class="liquid-glass">
        <div class="loader-content">
            <ion-icon name="heart-half-outline" class="pulse-icon"></ion-icon>
            <h2>Preparando una sorpresita...</h2>
            <div class="progress-bar-container"><div class="progress-bar"></div></div>
            <p class="timer-text">Dame <span id="countdown">15</span> segunditos</p>
        </div>
    </div>

    <main id="app-container" class="hidden"></main>

    <!-- Barra Inferior (Dock de 3 Opciones) -->
    <nav id="bottom-dock" class="glass-dock hidden">
        <button class="dock-item active" id="btn-principal" onclick="cargarComponente('home')">
            <ion-icon name="home"></ion-icon>
            <span>Inicio</span>
        </button>
        <button class="dock-item" id="btn-metaforas" onclick="cargarComponente('metaforas')">
            <ion-icon name="rose-outline"></ion-icon>
            <span>Metáforas</span>
        </button>
        <button class="dock-item" id="btn-galeria" onclick="cargarComponente('galeria')">
            <ion-icon name="images-outline"></ion-icon>
            <span>Álbum</span>
        </button>
    </nav>

    <div id="lightbox-modal" class="hidden">
        <div class="lightbox-backdrop" onclick="closeLightbox()"></div>
        <button class="lightbox-close" onclick="closeLightbox()"><ion-icon name="close-outline"></ion-icon></button>
        
        <div class="lightbox-content">
            <button class="lightbox-nav prev" onclick="changeImage(-1)"><ion-icon name="chevron-back-outline"></ion-icon></button>
            <img id="lightbox-img" src="" alt="Nuestro recuerdo">
            <button class="lightbox-nav next" onclick="changeImage(1)"><ion-icon name="chevron-forward-outline"></ion-icon></button>
        </div>
    </div>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="script.js"></script>
</body>
</html>
