<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16080f">
<title>Para Mi Amor</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500;600&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=4">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div id="cursor-glow" aria-hidden="true"></div>
<div class="bg-glow glow-1"></div><div class="bg-glow glow-2"></div>
<div id="background-icons" aria-hidden="true"></div>

<div id="loader-screen">
  <div class="loader-content">
    <ion-icon name="heart" class="pulse-icon"></ion-icon>
    <h2>Preparando una sorpresita…</h2>
    <div class="progress-bar-container"><div class="progress-bar"></div></div>
    <p class="timer-text">Dame <span id="countdown">15</span> segunditos</p>
    <button class="skip-btn" id="skip-btn">Saltar</button>
  </div>
</div>

<main id="app-container" class="hidden"></main>

<nav id="bottom-dock" class="glass-dock hidden" aria-label="Navegación">
  <button class="dock-item active" id="btn-principal" onclick="cargarComponente('home')"><ion-icon name="home"></ion-icon><span>Inicio</span></button>
  <button class="dock-item" id="btn-metaforas" onclick="cargarComponente('metaforas')"><ion-icon name="rose-outline"></ion-icon><span>Metáforas</span></button>
  <button class="dock-item" id="btn-galeria" onclick="cargarComponente('galeria')"><ion-icon name="images-outline"></ion-icon><span>Álbum</span></button>
</nav>

<div id="lightbox-modal" class="hidden">
  <div class="lightbox-backdrop" onclick="closeLightbox()"></div>
  <button class="lightbox-close" aria-label="Cerrar" onclick="closeLightbox()"><ion-icon name="close-outline"></ion-icon></button>
  <div class="lightbox-content">
    <button class="lightbox-nav prev" aria-label="Anterior" onclick="changeImage(-1)"><ion-icon name="chevron-back-outline"></ion-icon></button>
    <img id="lightbox-img" src="" alt="Nuestro recuerdo">
    <button class="lightbox-nav next" aria-label="Siguiente" onclick="changeImage(1)"><ion-icon name="chevron-forward-outline"></ion-icon></button>
  </div>
  <p id="lightbox-count"></p>
</div>

<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
<script src="fotos.js?v=4"></script>
<script src="script.js?v=4"></script>
<script type="module" src="scene.js?v=4"></script>
</body>
</html>
